[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnn-study"
version = "0.1.0"
description = "Reproducible cart-pole size, training-budget and interpretability study"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "ncps==1.0.1", "gymnasium>=0.29,<2", "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lnn-study = "lnn_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
